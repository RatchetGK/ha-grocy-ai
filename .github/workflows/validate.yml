name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  privacy:
    name: Secrets & private data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Generic secret / private-data patterns (whole history)
        run: python3 scripts/check_private_data.py --all
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    # hacs/action refuses private repositories; runs automatically once public.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
          # Not listed in home-assistant/brands (custom repository only).
          ignore: brands

  hacs-structure:
    name: HACS structure (private repo)
    if: ${{ github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check HACS layout and metadata
        run: |
          set -e
          test "$(ls -d custom_components/*/ | wc -l)" -eq 1
          jq -e '.name and .homeassistant' hacs.json
          m=custom_components/grocy_ai/manifest.json
          jq -e '.domain == "grocy_ai" and .version and .documentation and .issue_tracker and .codeowners and .config_flow' "$m"
          test -f README.md
